version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /services/j3w1ctl-auth
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  # The composite setup action pins setup-node too; list its directory so it
  # is bumped with the workflows.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/setup"]
    schedule:
      interval: weekly
